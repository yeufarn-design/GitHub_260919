<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="todo-header">
      <div class="header-row">
        <div>
          <p class="eyebrow">TODAY'S LIST</p>
          <h1>待辦清單</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span id="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span id="theme-toggle-label">深色模式</span>
        </button>
      </div>
      <p class="subtitle">把今天想完成的事，一件件放在這裡。</p>
    </header>

    <!-- 新增待辦事項的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="visually-hidden" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="接下來要完成什麼?"
        maxlength="120"
      >
      <button class="add-button" type="submit">新增</button>
    </form>

    <div class="filter-controls" role="group" aria-label="篩選待辦事項">
      <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦事項會由 JavaScript 動態放入這個清單 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="todo-footer">
      <span id="remaining-count">未完成:0 項</span>
      <button id="clear-completed" class="clear-completed-button" type="button" aria-label="清除所有已完成的待辦事項" disabled>
        清除已完成
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
